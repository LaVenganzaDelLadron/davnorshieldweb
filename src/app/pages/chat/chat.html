<main class="page-shell"><header class="page-heading"><div><p class="eyebrow">Community support</p><h1>CyberShield chat</h1><p>Ask the CyberShield assistant about online safety.</p></div></header><section class="cyber-card chat-layout"><div class="chat-window"><div class="chat-messages">@for(message of messages; track message.id){<div class="bubble" [class.in]="message.role==='assistant'" [class.out]="message.role==='user'">{{message.content}}</div>}@if(!messages.length){<div class="bubble in">Hello. Ask me how to spot a scam or protect your account.</div>}</div>@if(error){<p class="field-error" role="alert">{{error}}</p>}<div class="chat-input"><input class="input" [(ngModel)]="prompt" (keyup.enter)="send()" placeholder="Write a message..."><button class="btn btn-primary" type="button" [disabled]="loading" (click)="send()">{{loading ? 'Sending...' : 'Send →'}}</button></div></div></section></main>
