<main class="page-shell"><header class="page-heading"><div><p class="eyebrow">Workspace preferences</p><h1>Settings</h1><p>Manage account security and notification preferences.</p></div></header>
@if (error) { <p class="field-error" role="alert">{{ error }}</p> }
@if (success) { <p class="auth-success" role="status">{{ success }}</p> }
<section class="data-grid two"><article class="cyber-card panel"><div class="panel-title"><h2>Notifications</h2></div><p class="muted">Notification preferences are not available from the current API.</p></article><article class="cyber-card panel"><div class="panel-title"><h2>Change password</h2></div><form [formGroup]="passwordForm" (ngSubmit)="changePassword()" class="form-grid"><label>Current password<input class="input" type="password" formControlName="currentPassword" autocomplete="current-password"></label><label>New password<input class="input" type="password" formControlName="newPassword" autocomplete="new-password"></label><button class="btn btn-secondary" type="submit" [disabled]="saving">{{ saving ? 'Updating...' : 'Update password' }}</button></form></article></section></main>
